<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TREZZY | Biblioteca Oficial 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card-zoom { transition: transform 0.25s ease, border-color 0.25s ease; }
    .card-zoom:hover { transform: translateY(-4px); border-color: #e11d48; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 px-4 md:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="text-2xl font-black tracking-wider text-rose-600">TREZZY</span>
        <span class="text-xs font-semibold uppercase tracking-wider bg-zinc-900 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-md">
          Área de Membros
        </span>
        <span id="badge-total" class="hidden sm:inline-block text-xs text-zinc-400">
          Carregando...
        </span>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <input
          id="input-busca"
          type="text"
          placeholder="Buscar STL, 3MF, chave..."
          class="bg-zinc-900 border border-zinc-800 focus:border-rose-600 focus:outline-none text-sm text-white px-3 py-2 rounded-lg w-44 sm:w-60"
        />

        <select
          id="select-topico"
          class="bg-zinc-900 border border-zinc-800 focus:border-rose-600 focus:outline-none text-sm text-white px-3 py-2 rounded-lg max-w-[170px]"
        >
          <option value="TODOS">Todos os Tópicos</option>
        </select>

        <select
          id="select-ext"
          class="bg-zinc-900 border border-zinc-800 focus:border-rose-600 focus:outline-none text-sm text-white px-3 py-2 rounded-lg"
        >
          <option value="TODAS">Extensões</option>
          <option value=".3mf">.3mf</option>
          <option value=".stl">.stl</option>
          <option value=".zip">.zip</option>
          <option value=".rar">.rar</option>
          <option value=".7z">.7z</option>
        </select>

        <button
          onclick="abrirModalToken()"
          id="btn-token-status"
          class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 transition cursor-pointer"
        >
          <span id="token-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
          <span>Chave de Acesso</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section id="hero-section" class="relative border-b border-zinc-800/80 overflow-hidden hidden">
    <div id="hero-bg" class="absolute inset-0 bg-cover bg-center opacity-35 scale-105 blur-[2px]"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-zinc-950 via-zinc-950/90 to-zinc-950/40"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-transparent to-zinc-950/60"></div>

    <div class="relative max-w-7xl mx-auto px-4 md:px-8 py-12 md:py-20">
      <div class="max-w-2xl">
        <div class="flex items-center gap-2 mb-3">
          <span class="bg-rose-600 text-white text-[11px] font-bold uppercase px-2 py-0.5 rounded">Destaque</span>
          <span id="hero-topico" class="text-xs font-semibold text-rose-400 uppercase tracking-wider"></span>
        </div>
        <h1 id="hero-titulo" class="text-3xl md:text-5xl font-extrabold text-white tracking-tight capitalize mb-3"></h1>
        <p id="hero-meta" class="text-sm text-zinc-300 mb-6"></p>
        <div class="flex flex-wrap gap-3">
          <button
            id="hero-btn-download"
            class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm px-6 py-3 rounded-lg shadow-lg shadow-rose-600/20 transition cursor-pointer"
          >
            Baixar Arquivo Agora
          </button>
          <button
            id="hero-btn-detalhes"
            class="bg-zinc-800/90 hover:bg-zinc-700 text-white font-semibold text-sm px-5 py-3 rounded-lg border border-zinc-700 transition cursor-pointer"
          >
            Detalhes Técnicos
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Conteúdo Principal -->
  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 md:px-8 py-8">
    <div id="loading-state" class="py-24 text-center text-zinc-400">
      <div class="inline-block w-8 h-8 border-2 border-rose-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-sm">Sincronizando catálogo com Cloudflare R2...</p>
    </div>
    <div id="catalogo-container" class="space-y-10 hidden"></div>
  </main>

  <!-- Modal Detalhes do Modelo -->
  <div id="modal-detalhes" onclick="fecharModalDetalhes()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl">
      <div class="relative aspect-video bg-zinc-950 flex items-center justify-center">
        <img id="modal-img" src="" alt="" class="w-full h-full object-cover" />
        <span id="modal-ext" class="absolute top-3 right-3 bg-black/80 border border-zinc-700 text-xs font-bold uppercase px-2.5 py-1 rounded-md"></span>
      </div>
      <div class="p-6">
        <span id="modal-topico" class="text-xs font-bold uppercase tracking-wider text-rose-500"></span>
        <h3 id="modal-titulo" class="text-xl font-bold text-white capitalize mt-1 mb-4"></h3>

        <div class="bg-zinc-950 border border-zinc-800/90 rounded-xl p-3.5 text-xs text-zinc-300 space-y-1.5 font-mono mb-5">
          <div><span class="text-zinc-500">Arquivo:</span> <span id="modal-arquivo" class="break-all"></span></div>
          <div><span class="text-zinc-500">Chave:</span> <span id="modal-chave"></span></div>
          <div><span class="text-zinc-500">Tamanho:</span> <span id="modal-tamanho"></span></div>
          <div><span class="text-zinc-500">Grupo:</span> <span id="modal-grupo"></span></div>
        </div>

        <div class="flex items-center justify-end gap-3">
          <button onclick="fecharModalDetalhes()" class="bg-zinc-800 hover:bg-zinc-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg cursor-pointer">
            Fechar
          </button>
          <button id="modal-btn-download" class="bg-rose-600 hover:bg-rose-500 text-white text-sm font-bold px-5 py-2.5 rounded-lg cursor-pointer">
            Download Seguro
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Token de Membro -->
  <div id="modal-token" onclick="fecharModalToken()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-1">Chave de Acesso do Membro</h3>
      <p class="text-xs text-zinc-400 mb-4">
        Insira sua chave de assinante para liberar os downloads diretos do servidor privado.
      </p>
      <input
        id="input-token-modal"
        type="password"
        placeholder="Cole sua chave de acesso aqui..."
        class="w-full bg-zinc-950 border border-zinc-700 focus:border-rose-600 focus:outline-none text-sm text-white px-3.5 py-2.5 rounded-lg mb-4"
      />
      <div class="flex justify-end gap-2">
        <button onclick="fecharModalToken()" class="bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold px-4 py-2.5 rounded-lg cursor-pointer">
          Cancelar
        </button>
        <button onclick="salvarToken()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-5 py-2.5 rounded-lg cursor-pointer">
          Salvar Chave
        </button>
      </div>
    </div>
  </div>

  <!-- Toast de Notificação -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 rounded-xl text-sm font-medium shadow-xl border"></div>

  <script>
    const R2_PUBLIC_URL = 'https://pub-9b4a5394ab8f4c7fae42da15591ac8cf.r2.dev';

    let catalogoCompleto = [];
    let topicosLista = [];
    let memberToken = localStorage.getItem('trezzy_member_token') || '';

    function atualizarStatusTokenUI() {
      const dot = document.getElementById('token-dot');
      dot.className = memberToken
        ? 'w-2 h-2 rounded-full bg-emerald-500'
        : 'w-2 h-2 rounded-full bg-amber-500';
    }

    function formatarTitulo(raw) {
      try {
        return decodeURIComponent(raw || '')
          .replace(/\+/g, ' ')
          .replace(/_/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      } catch {
        return (raw || '').replace(/\+/g, ' ').replace(/_/g, ' ');
      }
    }

    // Gera lista ordenada de possíveis URLs da capa no bucket R2
    function obterCandidatosCover(item) {
      const lista = [];

      if (item.url_cover) {
        let u = item.url_cover.replace('https://SEU_DOMINIO_R2', R2_PUBLIC_URL);
        if (u.startsWith(R2_PUBLIC_URL) && !u.includes(`${R2_PUBLIC_URL}/stl/`)) {
          lista.push(u.replace(R2_PUBLIC_URL, `${R2_PUBLIC_URL}/stl`));
        }
        lista.push(u);
      }

      if (item.cover_relativa) {
        const rel = item.cover_relativa.replace(/^\/+/, '');
        lista.push(rel.startsWith('stl/') ? `${R2_PUBLIC_URL}/${rel}` : `${R2_PUBLIC_URL}/stl/${rel}`);
        lista.push(`${R2_PUBLIC_URL}/${rel}`);
      }

      if (item.cover_exata) {
        lista.push(`${R2_PUBLIC_URL}/stl/covers/${item.cover_exata}`);
        lista.push(`${R2_PUBLIC_URL}/covers/${item.cover_exata}`);
      }

      if (item.chave) {
        lista.push(`${R2_PUBLIC_URL}/stl/covers/${item.chave}.jpg`);
        lista.push(`${R2_PUBLIC_URL}/stl/covers/${item.chave}.png`);
        lista.push(`${R2_PUBLIC_URL}/stl/covers/${item.chave}.webp`);
        lista.push(`${R2_PUBLIC_URL}/covers/${item.chave}.jpg`);
      }

      return [...new Set(lista.filter(Boolean))];
    }

    function aplicarImagemComFallback(imgEl, candidatos, fallbackEl) {
      let idx = 0;
      function tentarProximo() {
        if (idx >= candidatos.length) {
          imgEl.style.display = 'none';
          if (fallbackEl) fallbackEl.classList.remove('hidden');
          return;
        }
        imgEl.src = candidatos[idx++];
      }
      imgEl.onerror = tentarProximo;
      imgEl.onload = () => {
        imgEl.style.display = 'block';
        if (fallbackEl) fallbackEl.classList.add('hidden');
      };
      tentarProximo();
    }

    function mostrarToast(msg, erro = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-xl border ${
        erro
          ? 'bg-red-950/95 border-red-700 text-red-100'
          : 'bg-emerald-950/95 border-emerald-700 text-emerald-100'
      }`;
      el.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.add('hidden'), 4000);
    }

    async function iniciarDownload(item) {
      if (!memberToken) {
        mostrarToast('Informe sua Chave de Acesso para baixar.', true);
        abrirModalToken();
        return;
      }

      const nomeArquivo = item.arquivo || item.arquivo_exato || item.caminho_relativo;
      mostrarToast(`Localizando ${nomeArquivo} no servidor seguro...`);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${memberToken}`
          },
          body: JSON.stringify({
            chave: item.chave,
            arquivo: nomeArquivo,
            caminho_relativo: item.caminho_relativo || null,
            topico: item.topico || null
          })
        });

        const data = await res.json();
        if (!res.ok) {
          mostrarToast(data.error || 'Erro ao localizar arquivo.', true);
          return;
        }

        mostrarToast('Download iniciado!');
        window.location.href = data.url;
      } catch (e) {
        mostrarToast('Falha de comunicação com o Worker.', true);
      }
    }

    function abrirModalDetalhes(item) {
      const img = document.getElementById('modal-img');
      aplicarImagemComFallback(img, obterCandidatosCover(item), null);

      document.getElementById('modal-ext').textContent = item.extensao || '.3mf';
      document.getElementById('modal-topico').textContent = item.topico || 'Geral';
      document.getElementById('modal-titulo').textContent = formatarTitulo(item.titulo);
      document.getElementById('modal-arquivo').textContent = item.arquivo || item.arquivo_exato || '-';
      document.getElementById('modal-chave').textContent = item.chave;
      document.getElementById('modal-tamanho').textContent = `${item.tamanho_mb} MB`;
      document.getElementById('modal-grupo').textContent = item.grupo || 'Trezzy 3D';
      document.getElementById('modal-btn-download').onclick = () => iniciarDownload(item);

      const modal = document.getElementById('modal-detalhes');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function fecharModalDetalhes() {
      const modal = document.getElementById('modal-detalhes');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function abrirModalToken() {
      document.getElementById('input-token-modal').value = memberToken;
      const modal = document.getElementById('modal-token');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function fecharModalToken() {
      const modal = document.getElementById('modal-token');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function salvarToken() {
      memberToken = document.getElementById('input-token-modal').value.trim();
      localStorage.setItem('trezzy_member_token', memberToken);
      atualizarStatusTokenUI();
      fecharModalToken();
      mostrarToast('Chave de acesso salva neste navegador.');
    }

    function criarCardHTML(item) {
      const card = document.createElement('div');
      card.className = 'card-zoom bg-zinc-900 border border-zinc-800/90 rounded-xl overflow-hidden flex flex-col justify-between';

      const tituloLimpo = formatarTitulo(item.titulo);

      card.innerHTML = `
        <div>
          <div class="relative aspect-video bg-zinc-950 overflow-hidden cursor-pointer group">
            <img
              alt="${tituloLimpo}"
              loading="lazy"
              class="card-cover-img w-full h-full object-cover group-hover:scale-105 transition duration-300"
            />
            <div class="card-cover-fallback hidden w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-zinc-900 to-zinc-950 text-zinc-500 p-4 text-center">
              <span class="text-lg font-black uppercase text-rose-500/80">${item.extensao || '3D'}</span>
              <span class="text-[11px] mt-1 line-clamp-1">${item.topico || 'Modelo 3D'}</span>
            </div>
            <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-sm border border-zinc-700/80 text-[10px] font-bold uppercase px-2 py-0.5 rounded text-zinc-200">
              ${item.extensao || '.3mf'}
            </span>
          </div>
          <div class="p-3.5">
            <h3 class="text-sm font-semibold text-zinc-100 capitalize line-clamp-2 leading-snug cursor-pointer hover:text-rose-400 transition">
              ${tituloLimpo}
            </h3>
          </div>
        </div>
        <div class="px-3.5 pb-3.5">
          <div class="flex items-center justify-between text-[11px] text-zinc-400 mb-2.5">
            <span>${item.tamanho_mb} MB</span>
            <span>#${item.message_id}</span>
          </div>
          <button class="btn-dl w-full bg-zinc-800 hover:bg-rose-600 text-white text-xs font-bold py-2 rounded-lg transition cursor-pointer">
            Baixar Arquivo
          </button>
        </div>
      `;

      const imgEl = card.querySelector('.card-cover-img');
      const fallbackEl = card.querySelector('.card-cover-fallback');
      aplicarImagemComFallback(imgEl, obterCandidatosCover(item), fallbackEl);

      card.querySelector('.aspect-video').onclick = () => abrirModalDetalhes(item);
      card.querySelector('h3').onclick = () => abrirModalDetalhes(item);
      card.querySelector('.btn-dl').onclick = () => iniciarDownload(item);

      return card;
    }

    function renderizarCatalogo() {
      const busca = document.getElementById('input-busca').value.toLowerCase().trim();
      const topicoFiltro = document.getElementById('select-topico').value;
      const extFiltro = document.getElementById('select-ext').value.toLowerCase();

      const filtrados = catalogoCompleto.filter(item => {
        const matchTopico = topicoFiltro === 'TODOS' || item.topico === topicoFiltro;
        const matchExt = extFiltro === 'todas' || (item.extensao || '').toLowerCase() === extFiltro;
        const nomeArq = item.arquivo || item.arquivo_exato || '';
        const matchBusca = !busca ||
          formatarTitulo(item.titulo).toLowerCase().includes(busca) ||
          nomeArq.toLowerCase().includes(busca) ||
          (item.chave || '').toLowerCase().includes(busca);
        return matchTopico && matchExt && matchBusca;
      });

      const hero = document.getElementById('hero-section');
      if (!busca && topicoFiltro === 'TODOS' && extFiltro === 'todas' && filtrados.length > 0) {
        const destaque = filtrados.find(i => i.url_cover || i.cover_exata || i.cover_relativa) || filtrados[0];
        const heroCover = obterCandidatosCover(destaque)[0] || '';
        document.getElementById('hero-bg').style.backgroundImage = `url('${heroCover}')`;
        document.getElementById('hero-topico').textContent = destaque.topico;
        document.getElementById('hero-titulo').textContent = formatarTitulo(destaque.titulo);
        document.getElementById('hero-meta').textContent =
          `Formato ${(destaque.extensao || '').toUpperCase()} • ${destaque.tamanho_mb} MB • Grupo ${destaque.grupo || 'Trezzy 3D'}`;
        document.getElementById('hero-btn-download').onclick = () => iniciarDownload(destaque);
        document.getElementById('hero-btn-detalhes').onclick = () => abrirModalDetalhes(destaque);
        hero.classList.remove('hidden');
      } else {
        hero.classList.add('hidden');
      }

      const container = document.getElementById('catalogo-container');
      container.innerHTML = '';

      if (filtrados.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-zinc-400">Nenhum modelo encontrado para esse filtro.</div>`;
        return;
      }

      const grupos = {};
      filtrados.forEach(item => {
        const t = item.topico || 'Geral';
        if (!grupos[t]) grupos[t] = [];
        grupos[t].push(item);
      });

      Object.entries(grupos).forEach(([topico, itens]) => {
        const sec = document.createElement('section');
        sec.innerHTML = `
          <div class="flex items-center justify-between mb-3.5">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
              <span>${topico}</span>
              <span class="text-xs font-normal text-zinc-500">(${itens.length})</span>
            </h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        `;

        const grid = sec.querySelector('.grid');
        const limite = topicoFiltro === 'TODOS' && !busca ? 12 : itens.length;
        itens.slice(0, limite).forEach(item => grid.appendChild(criarCardHTML(item)));

        if (itens.length > limite) {
          const btnVerMais = document.createElement('button');
          btnVerMais.className = 'mt-4 text-xs font-semibold text-rose-400 hover:text-rose-300 cursor-pointer';
          btnVerMais.textContent = `Ver todos os ${itens.length} modelos de "${topico}" →`;
          btnVerMais.onclick = () => {
            document.getElementById('select-topico').value = topico;
            renderizarCatalogo();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
          sec.appendChild(btnVerMais);
        }

        container.appendChild(sec);
      });
    }

    async function carregarDados() {
      atualizarStatusTokenUI();
      try {
        const res = await fetch('/api/catalogo', { cache: 'no-store' });
        const json = await res.json();

        if (!res.ok) {
          document.getElementById('loading-state').innerHTML =
            `<p class="text-red-400 text-sm">${json.error || 'Erro ao localizar catalogo_site.json no R2.'}</p>`;
          return;
        }

        catalogoCompleto = json.arquivos || json.itens || [];
        topicosLista = json.topicos || [...new Set(catalogoCompleto.map(i => i.topico))];

        document.getElementById('badge-total').textContent = `${json.total_arquivos || catalogoCompleto.length} arquivos`;

        const selectTopico = document.getElementById('select-topico');
        topicosLista.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          selectTopico.appendChild(opt);
        });

        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('catalogo-container').classList.remove('hidden');
        renderizarCatalogo();
      } catch (err) {
        document.getElementById('loading-state').innerHTML =
          `<p class="text-red-400 text-sm">Erro de conexão ao carregar o catálogo.</p>`;
      }
    }

    document.getElementById('input-busca').addEventListener('input', renderizarCatalogo);
    document.getElementById('select-topico').addEventListener('change', renderizarCatalogo);
    document.getElementById('select-ext').addEventListener('change', renderizarCatalogo);

    carregarDados();
  </script>
</body>
</html>
